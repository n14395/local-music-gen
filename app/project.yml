name: LocalMusicGen
options:
  # The identifier is set outright on each target below rather than derived
  # from this prefix: the app's is `com.n14395.local-music-gen`, which is the
  # repo's name rather than the target's, and XcodeGen would otherwise build
  # `com.n14395.LocalMusicGen` from the target name.
  bundleIdPrefix: com.n14395
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # A stable signing identity (not ad-hoc "-"): keychain "Always Allow" grants
    # are tied to the code signature, and ad-hoc signatures change every build,
    # re-prompting for the HF token forever. Hash of the newest
    # "Apple Development: Nicholas Fay (4WXBKBCQ42)" cert (expires 2026-12-13);
    # update via `security find-identity -v -p codesigning` when it rotates.
    CODE_SIGN_IDENTITY: F67DC1F6A8F864CD087F247CC9F624EE441898A4
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LocalMusicGen:
    type: application
    platform: macOS
    sources: [LocalMusicGen]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Owns the defaults domain, the keychain service string in
        # `Keychain.swift`, and the single-instance check. Change one and the
        # other three have to move with it.
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.local-music-gen
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: LocalMusicGen/Info.plist
      properties:
        CFBundleDisplayName: LocalMusicGen
        NSHumanReadableCopyright: ""
        NSUserNotificationsUsageDescription: Notifies you when a generation finishes.
  LocalMusicGenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LocalMusicGenTests]
    dependencies:
      - target: LocalMusicGen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.local-music-gen.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LocalMusicGen.app/Contents/MacOS/LocalMusicGen
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  LocalMusicGen:
    build:
      targets:
        LocalMusicGen: all
        LocalMusicGenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LocalMusicGenTests]
