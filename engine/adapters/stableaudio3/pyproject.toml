[project]
name = "adapter-stableaudio3"
version = "0.1.0"
description = "Stable Audio 3 Small adapter (text-to-audio, audio-to-audio, inpaint, extend) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "stable-audio-3",
    "soundfile>=0.12",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
stableaudio3 = "adapter_stableaudio3.adapter:StableAudio3Adapter"

[tool.uv]
# Apple Silicon-only engine; upstream's CUDA index carries Linux-only markers
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }
# Not on PyPI; pinned to the rev this adapter was written against.
stable-audio-3 = { git = "https://github.com/Stability-AI/stable-audio-3", rev = "a0b57f5483c4588f827f3552b7d5c6ca2a9687be" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_stableaudio3"]
