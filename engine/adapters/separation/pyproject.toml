[project]
name = "adapter-separation"
version = "0.1.0"
description = "Stem separation adapter (Demucs + RoFormers via audio-separator) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
# NOTE(SR6): demucs-mlx==1.4.6 was evaluated for the MLX fast path and GATED
# OUT: its hard dependency mlx-audio-io==1.3.11 is sdist-only and fails to
# link on macOS 27 arm64 (undefined mlx_audio::backend_* symbols) under every
# combination tried (build isolation on/off, CommandLineTools + full Xcode,
# exact mlx==0.31.2 headers). Re-evaluate when mlx-audio-io ships wheels or a
# fixed sdist.
dependencies = [
    "demucs==4.1.0",
    "audio-separator[cpu]==0.44.5",
    "soundfile>=0.12",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
separation = "adapter_separation.adapter:SeparationAdapter"

[tool.uv]
# the engine is Apple Silicon-only; without this, uv also resolves for
# platforms where demucs and audio-separator pin conflicting torch builds
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_separation"]
