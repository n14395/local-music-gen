[project]
name = "adapter-mlxstt"
version = "0.1.0"
description = "MLX speech/audio-to-text adapter (Whisper lyrics, Qwen2-Audio captions) for the LocalMusicGen engine"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mlx-audio",
    # transformers' `apply_chat_template` needs Jinja, and Qwen2-Audio's
    # processor goes through it. mlx-audio does not declare the dependency,
    # so without this the model loads and then dies on its first prompt.
    "jinja2",
    "soundfile>=0.12",
    "soxr",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
mlxstt = "adapter_mlxstt.adapter:MLXSTTAdapter"

[tool.uv]
# mlx is Apple-silicon only; without this the lock tries to resolve for
# platforms that have no mlx wheel at all.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }
# Pinned separately from the `mlxaudio` family even though both start on the
# same revision. That family's pin also feeds MiniMax Music 3 generation, and
# bumping mlx-audio to pick up a newer speech model must never be able to
# change how the flagship music model renders.
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio", rev = "6546e953908800219454d4483592c1db9d8871a8" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_mlxstt"]
