[project]
name = "adapter-qwenomni"
version = "0.1.0"
description = "Qwen2.5-Omni music listeners (ACE-Step transcriber & captioner) for the LocalMusicGen engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The Qwen2_5Omni* classes need a current transformers; nothing here pins
    # an era (this family exists because these fine-tunes run on the modern
    # stack unmodified).
    "transformers>=4.52,<5",
    "torch>=2.4",
    # The Omni *processor* imports the image side even for audio-only input;
    # without torchvision + Pillow it dies loading, not at a call site.
    "torchvision",
    "pillow",
    "librosa>=0.10,<1.0",
    "soundfile>=0.12",
    "accelerate>=0.30",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
qwenomni = "adapter_qwenomni.adapter:QwenOmniAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_qwenomni"]
