[project]
name = "adapter-dsp"
version = "0.1.0"
description = "Deterministic DSP adapter (literal recombination: mixdown with Rubber Band R3 alignment) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pedalboard==0.9.24",
    "pyloudnorm==0.2.0",
    "soundfile>=0.12",
    "soxr>=0.4",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
dsp = "adapter_dsp.adapter:DSPAdapter"

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_dsp"]
