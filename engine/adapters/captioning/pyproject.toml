[project]
name = "adapter-captioning"
version = "0.1.0"
description = "Music captioning adapter (LP-MusicCaps) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2",
    # The vendored audio frontend is torchaudio's MelSpectrogram stack.
    "torchaudio>=2.2",
    "transformers>=4.45,<5",
    "soundfile>=0.12",
    "soxr",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
captioning = "adapter_captioning.adapter:CaptioningAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_captioning"]
