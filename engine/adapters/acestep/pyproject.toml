[project]
name = "adapter-acestep"
version = "0.1.0"
description = "ACE-Step 1.5 adapter (MLX LM + MPS DiT) for the LocalMusicGen engine"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ace-step",
    "mlx>=0.21; sys_platform == 'darwin'",
    "mlx-lm>=0.20; sys_platform == 'darwin'",
    "soundfile>=0.12",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
acestep = "adapter_acestep.adapter:ACEStepAdapter"

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }
ace-step = { git = "https://github.com/ace-step/ACE-Step-1.5", rev = "14c0211d5a0653b0f63e27686f4c3f151b4d8629" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_acestep"]
