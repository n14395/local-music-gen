[project]
name = "adapter-songbloom"
version = "0.1.0"
description = "SongBloom full-song generation (lyrics + style prompt, orphaned upstream) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The proven triage stack (2026-08-25). Upstream is orphaned (official
    # repos deleted; code survives in the rsxdalv fork) — treat every pin
    # here as frozen.
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "lightning",
    "transformers",
    "einops",
    # Its VAE frontend is stable-audio-tools-shaped and imports these
    # directly (`SongBloom/models/vae_frontend/bottleneck.py` →
    # `from vector_quantize_pytorch import ResidualVQ, FSQ`). They appear in
    # neither the fork's install_requires nor its requirements.txt, so
    # nothing pulls them in — the triage env only had them because the
    # harness installed the upstream requirement set by hand.
    "vector-quantize-pytorch==1.31.1",
    "alias-free-torch==0.0.6",
    "descript-audio-codec",
    "omegaconf",
    "huggingface-hub",
    "soundfile>=0.12",
    "soxr",
    "g2p-en",
    "num2words",
    "pypinyin",
    "cn2an",
    "wordsegment",
    "nltk",
    "spacy",
    "jieba-fast",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
songbloom = "adapter_songbloom.adapter:SongBloomAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_songbloom"]
