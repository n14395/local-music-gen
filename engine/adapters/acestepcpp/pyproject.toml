[project]
name = "adapter-acestepcpp"
version = "0.1.0"
description = "ACE-Step 1.5 via acestep.cpp (GGUF + Metal) for the LocalMusicGen engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "soundfile>=0.12",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
acestepcpp = "adapter_acestepcpp.adapter:AceStepCppAdapter"

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_acestepcpp"]
