[project]
name = "adapter-yue2"
version = "0.1.0"
description = "YuE2 lyrics-to-song (AR-NAR MoT + flow matching, 48 kHz stereo) for the LocalMusicGen engine"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The upstream package carries its own exact pins (torch 2.10.0,
    # transformers 4.57.6 — macOS arm64 wheels exist for all of them).
    # The CUDA-only fast path (vllm/triton) lives behind upstream's
    # optional "fast" extra and is deliberately not pulled.
    "yue2-infer @ https://github.com/multimodal-art-projection/YuE/archive/92a73cc7652fcc1f937855e4b765e0a0edd7ff2e.tar.gz",
    "soundfile>=0.12",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
yue2 = "adapter_yue2.adapter:YuE2Adapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[tool.hatch.metadata]
# The yue2-infer dependency is a pinned GitHub tarball (a direct reference),
# which hatchling refuses by default.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_yue2"]
