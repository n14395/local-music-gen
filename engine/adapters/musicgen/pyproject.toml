[project]
name = "adapter-musicgen"
version = "0.1.0"
description = "MusicGen adapter (transformers on MPS) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",  # melody chroma extractor + reference-audio resampling
    "transformers>=4.44,<5",
    "soundfile>=0.12",
    "numpy",
    "mlx>=0.31; sys_platform == 'darwin'",  # MLX speed backend (settings.backend = "mlx")
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
musicgen = "adapter_musicgen.adapter:MusicGenAdapter"

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_musicgen"]
