[project]
name = "adapter-diffusers"
version = "0.1.0"
description = "Generic diffusers audio-pipeline adapter for user-added models"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "diffusers>=0.31",
    "transformers>=4.44,<5",
    "accelerate",
    "sentencepiece",
    "soundfile>=0.12",
    # For best-of-N: CLAP scores candidates at 48 kHz and these pipelines
    # vocode at 16 kHz. diffusers' own ranking reaches for librosa (and a
    # numba/llvmlite tree) to do the same one resample.
    "soxr",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
diffusers = "adapter_diffusers.adapter:DiffusersAudioAdapter"

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_diffusers"]
