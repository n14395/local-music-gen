[project]
name = "adapter-songgen"
version = "0.1.0"
description = "SongGen single-stage text+lyrics-to-song (ICML 2025) for the LocalMusicGen engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "songgen",
    # SongGen pins transformers 4.43.x; era-match with the torch 2.4 pair
    # and numpy<2 (proven triage stack, 2026-08-25).
    "torch==2.4.1",
    "torchaudio==2.4.1",
    "numpy<2",
    "setuptools<81",
    "soundfile>=0.12",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
songgen = "adapter_songgen.adapter:SongGenAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }
songgen = { git = "https://github.com/LiuZH-19/SongGen", rev = "94d2d20ca882aa55c8e0abc6154a6ac52840c781" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_songgen"]
