[project]
name = "adapter-assistant"
version = "0.1.0"
description = "Writing-assistant adapter (small local instruct LLM that drafts prompts, lyrics and titles) for the LocalMusicGen engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The whole family is one dependency. mlx-lm brings mlx, transformers and
    # the tokenizers, and nothing here touches torch — which is why this venv
    # provisions in seconds and stays small enough to be worth warm-pooling.
    "mlx-lm==0.29.1",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
assistant = "adapter_assistant.adapter:AssistantAdapter"

[tool.uv]
# mlx is Apple-silicon only; without this the lock tries to resolve for
# platforms that have no mlx wheel at all.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_assistant"]
