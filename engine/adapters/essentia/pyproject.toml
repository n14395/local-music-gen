[project]
name = "adapter-essentia"
version = "0.1.0"
description = "Essentia model-zoo tagging (Discogs-EffNet genre/mood/danceability heads) for the LocalMusicGen engine"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Ships working macOS arm64 wheels since 2.1b6.dev1177+ (the old caveat
    # about missing Apple Silicon builds is obsolete — verified 2026-08).
    "essentia-tensorflow",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
essentia = "adapter_essentia.adapter:EssentiaAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_essentia"]
