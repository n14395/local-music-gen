[project]
name = "adapter-minimax"
version = "0.1.0"
description = "MiniMax Music 3 adapter (diffusers ModularPipeline) for the LocalMusicGen engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.6",
    "diffusers",
    "transformers>=4.51",
    "accelerate",
    "sentencepiece",
    "soundfile>=0.12",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
minimax = "adapter_minimax.adapter:MiniMaxAdapter"

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "d5baa4fb548294f47dbca49890abd4b291204c60" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_minimax"]
