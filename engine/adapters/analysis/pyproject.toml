[project]
name = "adapter-analysis"
version = "0.1.0"
description = "Musical analysis adapter (beat_this beats/downbeats, key, structure, loudness) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beat-this==1.1.0",
    # SQUIM quality scores (analysis-squim mode) ride torchaudio.pipelines;
    # audio I/O stays on soundfile, so no torchcodec is needed here.
    "torchaudio>=2.2",
    "librosa>=0.10,<1.0",
    "soundfile>=0.12",
    "soxr",
    "pyloudnorm>=0.1",
    # chord-bed MIDI rendering (the BTC entry's transcribe route)
    "pretty_midi>=0.2.10",
    "numpy",
    # CLAP timbre embeddings (analysis-clap variant); native ClapModel, no
    # remote code
    "transformers>=4.40,<5",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
analysis = "adapter_analysis.adapter:AnalysisAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_analysis"]
