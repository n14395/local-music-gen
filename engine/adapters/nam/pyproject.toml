[project]
name = "adapter-nam"
version = "0.1.0"
description = "Neural Amp Modeler re-amping (.nam captures, TONE3000-compatible) for the LocalMusicGen engine"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 0.10.0 on purpose: TONE3000 serves Architecture-1 .nam files whose
    # WaveNet config 0.13's rewrite mis-parses. The adapter renames the A1
    # keys (layers→layers_configs, head→head_config) for 0.10's classes.
    "neural-amp-modeler==0.10.0",
    # resampy-era transitive imports still want pkg_resources
    "setuptools<81",
    # nam 0.10's package __init__ imports its training GUI, which does a bare
    # `import requests` without declaring it. It used to arrive transitively
    # via transformers 4.x; transformers 5 dropped requests, so `import nam`
    # now dies with ModuleNotFoundError before any re-amping happens.
    "requests",
    "soundfile>=0.12",
    "soxr",
    "numpy",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
nam = "adapter_nam.adapter:NamAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_nam"]
