[project]
name = "adapter-mossmusic"
version = "0.1.0"
description = "MOSS-Music-8B music understanding (MLX community backend) for the LocalMusic engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx",
    "transformers",
    "soundfile>=0.12",
    "librosa",
    "numpy",
    "huggingface-hub",
    # the processor's audio side is torch-based even under the MLX backend
    "torch",
    "einops",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
mossmusic = "adapter_mossmusic.adapter:MossMusicAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_mossmusic"]
