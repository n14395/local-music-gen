[project]
name = "adapter-seedvc"
version = "0.1.0"
description = "seed-vc zero-shot voice conversion (task convert-voice) for the LocalMusic engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The proven triage stack (2026-08-25): torch 2.4 pair on CPU. Their code
    # autocasts on MPS, which torch 2.4 rejects — the adapter hides MPS in
    # the subprocess; a torch>=2.6 MPS attempt is known further work.
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "torchvision==0.19.0",
    "scipy==1.13.1",
    "librosa==0.10.2",
    "numpy<2",
    "huggingface-hub",
    "munch",
    "einops",
    "descript-audio-codec",
    "pydub",
    "resemblyzer",
    "transformers==4.46.3",
    "accelerate",
    "soundfile>=0.12",
    "pyyaml",
    # V2 stack (inference_v2.py) instantiates its wrapper via hydra
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "setuptools<81",
    "engine-protocol",
]

[project.entry-points."local_music.adapters"]
seedvc = "adapter_seedvc.adapter:SeedVCAdapter"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
engine-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_seedvc"]
