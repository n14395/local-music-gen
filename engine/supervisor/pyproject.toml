[project]
name = "localmusic-supervisor"
version = "0.1.0"
description = "LocalMusicGen inference engine supervisor (sidecar API)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface_hub>=0.34",
    "engine-protocol",
]

[project.scripts]
local-music-gen-engine = "supervisor.main:cli"

[tool.uv.sources]
engine-protocol = { path = "../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor"]
